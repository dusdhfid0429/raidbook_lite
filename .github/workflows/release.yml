name: Build & Release

# main에 version.py 변경이 push되면 설치파일을 빌드해 Release(vX.Y.Z)에 올린다.
# 같은 버전의 Release가 이미 있으면 빌드만 하고 게시는 건너뛴다.
on:
  push:
    branches: [main]
    paths: ["version.py"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"   # 테스트/빌드 출력의 한글·기호가 cp1252 콘솔에서 깨지지 않도록

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (python -c "import version; print(version.VERSION)").Trim()
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Tests
        run: |
          python Tests/test_boss_auction.py
          python Tests/test_channel_setup.py
          python Tests/test_boss_board.py
          python Tests/test_bid_burst.py
          python Tests/test_music.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: RaidBook_Setup
          path: dist/installer/*.exe

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RaidBook Lite ${{ steps.ver.outputs.tag }}
          files: dist/installer/*.exe
          generate_release_notes: true
